---
# Gateway custom resource for the east-west gateway Deployment/Service that is
# created by the Istio "gateway" chart with the eastwestgateway profile.
# This exposes port 15443 on a LoadBalancer so peer clusters can dial in.
apiVersion: v1
kind: Service
metadata:
  name: istio-eastwestgateway
  namespace: istio-system
  labels:
    app: istio-eastwestgateway
    istio: eastwestgateway
    topology.istio.io/network: network1
    app.kubernetes.io/part-of: service-mesh-istio-platform
  annotations:
    # Cloud-specific annotations select an internal or external load balancer.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: istio-eastwestgateway
    istio: eastwestgateway
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: tls
      port: 15443
      targetPort: 15443
    - name: tls-istiod
      port: 15012
      targetPort: 15012
    - name: tls-webhook
      port: 15017
      targetPort: 15017
