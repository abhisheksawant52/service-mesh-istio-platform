---
# Override values for the Istio "gateway" chart (north-south ingress).
# Chart: https://istio-release.storage.googleapis.com/charts (gateway)

name: istio-ingressgateway
revision: default

replicaCount: 2

service:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1024Mi

labels:
  istio: ingressgateway
